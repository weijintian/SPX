name: SpxChatIOS
options:
  bundleIdPrefix: com.spx
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_TESTABILITY: YES
targets:
  SpxChatIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpxChatIOS
        excludes:
          - Resources
          - Info.plist
      - path: SpxChatIOS/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spx.chat.ios
        INFOPLIST_FILE: SpxChatIOS/Info.plist
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 1.0.1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  SpxChatIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpxChatIOSTests
    dependencies:
      - target: SpxChatIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spx.chat.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SpxChatIOS:
    build:
      targets:
        SpxChatIOS: all
        SpxChatIOSTests: [test]
    test:
      targets:
        - SpxChatIOSTests
      gatherCoverageData: true
      environmentVariables:
        SPX_RUN_LIVE_TLS_PROBE: "1"
